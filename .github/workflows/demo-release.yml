name: Demo Release APK

on:
  push:
    branches: [ feature/demo-release-apk ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Create temporary release keystore
        run: keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"
      - name: Configure Wear OS release signing
        run: cp app/keystore app-wearos/keystore
      - name: Build Play Release APK
        run: ./gradlew assemblePlayRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-play-demo-release.apk
          path: app/build/outputs/apk/play/release/app-play-release.apk
      - name: Create demo GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="demo-audio-skip-rules-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<'EOF'
          Automated AntennaPod demo build for testing.

          Package ID: `de.danoeh.antennapod.demo`

          This is not an official AntennaPod release. It is signed with a temporary CI key, so uninstall any previously installed demo build before installing this one.
          EOF
          gh release create "$tag" \
            app/build/outputs/apk/play/release/app-play-release.apk \
            --target "$GITHUB_SHA" \
            --title "AntennaPod demo build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md \
            --prerelease
